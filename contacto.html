<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto - MiApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .navbar-custom {
      background-color: #343a40;
    }

    .footer-custom {
      background-color: #343a40;
      color: white;
      padding: 1rem 0;
      margin-top: auto;
    }

    .main-content {
      flex-grow: 1;
      padding: 2rem 1rem;
    }

    .main-content h1 {
      color: #343a40;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .form-control {
      padding: 12px 15px;
      font-size: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
    }

    .btn {
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./img/logo1.gif" alt="Logo" style="border-radius: 100%;"> MiApp
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="nosotros.html">Nosotros</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="contacto.html">Contacto</a>
          </li>
        </ul>
        
        <ul class="navbar-nav ms-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="accesoDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fas fa-user-circle me-1"></i> Acceso
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accesoDropdown">
              <li><a class="dropdown-item" href="login.html"><i class="fas fa-sign-in-alt me-2"></i>Login</a></li>
              <li><a class="dropdown-item" href="registro.html"><i class="fas fa-user-plus me-2"></i>Registro</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="ayuda.html"><i class="fas fa-question-circle me-2"></i>Ayuda</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="main-content container">
    <h1>Contacto</h1>
    <p class="mb-4">¿Tienes preguntas, comentarios o sugerencias? ¡Estamos para ayudarte!</p>
    
    <form id="contactForm">
      <div class="row">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Nombre completo" required>
        </div>
        <div class="col-md-6">
          <input type="email" class="form-control" placeholder="Correo electrónico" required>
        </div>
      </div>
      <div class="mt-3">
        <input type="text" class="form-control" placeholder="Asunto" required>
      </div>
      <div class="mt-3">
        <textarea class="form-control" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary w-100">Enviar mensaje</button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="footer-custom">
    <div class="container text-center">
      <p class="mb-0">&copy; 2025 MiApp. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
