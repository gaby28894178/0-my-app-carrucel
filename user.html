<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil del Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
    }
    footer {
      margin-top: auto;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="user.html">MiApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <button id="logoutBtn" class="btn btn-danger">Cerrar sesión</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container mt-5">
    <h2 class="mb-4">Perfil del Usuario</h2>
    <div class="card p-4 shadow-sm">
      <div class="row">
        <div class="col-md-4 text-center">
          <img id="userPhoto" src="" alt="Foto de perfil" class="img-fluid rounded-circle" width="150" height="150">
        </div>
        <div class="col-md-8">
          <p><strong>Nombre:</strong> <span id="userName"></span></p>
          <p><strong>Email:</strong> <span id="userEmail"></span></p>
          <p><strong>Email verificado:</strong> <span id="userVerified"></span></p>
          <p><strong>UID:</strong> <span id="userUID"></span></p>
          <p><strong>Creado el:</strong> <span id="userCreationTime"></span></p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025 MiApp - Todos los derechos reservados</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAki1J6NbnvJXfzC98i0EhG0APn7m1bmNM",
      authDomain: "basegaby-37b65.firebaseapp.com",
      projectId: "basegaby-37b65",
      storageBucket: "basegaby-37b65.appspot.com",
      messagingSenderId: "704261450213",
      appId: "1:704261450213:web:8eb5bb135b00c7795c670c",
      measurementId: "G-M3YMGDX62Z"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Array de avatares disponibles en tu carpeta local
    const avatars = [
      'avatar.png'
      // Agrega más según necesites
    ];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("Usuario autenticado:", user);
        document.getElementById("userEmail").textContent = user.email;
        document.getElementById("userUID").textContent = user.uid;
        document.getElementById("userName").textContent = user.displayName || "Admin sin dato";
        document.getElementById("userVerified").textContent = user.emailVerified ? "Sí" : "No";
        document.getElementById("userCreationTime").textContent = user.metadata?.creationTime || "No disponible";

        const userPhoto = document.getElementById("userPhoto");
        if (user.photoURL) {
          userPhoto.src = user.photoURL;
        } else {
          // Seleccionar avatar local aleatorio
          const randomIndex = Math.floor(Math.random() * avatars.length);
          userPhoto.src = `img/${avatars[randomIndex]}`;
          userPhoto.alt = 'Avatar predeterminado';
        }
      } else {
        window.location.href = "index.html";
      }
    });

    // Función para cerrar sesión
    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth)
        .then(() => window.location.href = "index.html")
        .catch((error) => console.error("Error al cerrar sesión:", error));
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
