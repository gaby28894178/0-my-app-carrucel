<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Firebase</title>
</head>
<body>
        <h1>Area de registro</h1>
        <input type="email" id="email" placeholder="Coloca aqui tu email" />
        <input type="password" id="pass" placeholder="Coloca aqui tu password" />
        <button onclick="enviar()" >Enviar</button>
        <h1>Area de acceso</h1>
        <input type="email" id="emailA" placeholder="Coloca aqui tu email" />
        <input type="password" id="passA" placeholder="Coloca aqui tu password" />
        <button onclick="acceso()" >Acceso</button>
        
    <h1 id="login"></h1>

<!-- The core Firebase JS SDK is always required and must be listed first -->
<script src="https://www.gstatic.com/firebasejs/6.2.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/6.2.0/firebase-auth.js"></script>

     https://firebase.google.com/docs/web/setup#config-web-app -->

<script>
  // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAki1J6NbnvJXfzC98i0EhG0APn7m1bmNM",
      authDomain: "basegaby-37b65.firebaseapp.com",
      projectId: "basegaby-37b65",
      storageBucket: "basegaby-37b65.appspot.com",
      messagingSenderId: "704261450213",
      appId: "1:704261450213:web:8eb5bb135b00c7795c670c",
      measurementId: "G-M3YMGDX62Z"
    };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);


  firebase.auth().onAuthStateChanged(function(user) {
  if (user) {
    var displayName = user.displayName;
    var email = user.email;
    var emailVerified = user.emailVerified;
    var photoURL = user.photoURL;
    var isAnonymous = user.isAnonymous;
    var uid = user.uid;
    var providerData = user.providerData;
    document.getElementById('login').innerHTML="Logueado "+user.email;
    console.log(user);
  } else {
    document.getElementById('login').innerHTML="No Logueado ";
  }
  });

  function enviar(){
    var email=document.getElementById('email').value;
    var pass=document.getElementById('pass').value;
    firebase.auth().createUserWithEmailAndPassword(email, pass)
    .catch(function(error) {
        var errorCode = error.code;
        var errorMessage = error.message;
        alert(errorMessage);
    });
  }
  function acceso(){
        var emailA=document.getElementById('emailA').value;
        var passA=document.getElementById('passA').value;
        firebase.auth().signInWithEmailAndPassword(emailA, passA)
        .catch(function(error) {
            var errorCode = error.code;
            var errorMessage = error.message;
            alert(errorMessage);
        });
   }
</script>
</body>
