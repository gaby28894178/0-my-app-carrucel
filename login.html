<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .navbar-custom {
      background-color: #343a40;
    }

    .footer-custom {
      background-color: #343a40;
      color: white;
      padding: 1rem 0;
      margin-top: auto;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 0;
      flex-grow: 1;
    }

    .auth-card {

    .btn {
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
    }

    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 1.05rem;
    }

    .alert {
      font-size: 1.05rem;
      padding: 1rem;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="./img/logo1.gif" alt="Logo" style="border-radius: 100%;"> MiApp
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="accesoDropdown" role="button" data-bs-toggle="dropdown">
            <i class="fas fa-user-circle me-1"></i> Acceso
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item active" href="login.html"><i class="fas fa-sign-in-alt me-2"></i>Login</a></li>
            <li><a class="dropdown-item" href="registro.html"><i class="fas fa-user-plus me-2"></i>Registro</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="ayuda.html"><i class="fas fa-question-circle me-2"></i>Ayuda</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenido principal -->
<main class="login-container">
  <div class="auth-card">
    <h2 class="text-center">Iniciar Sesión</h2>

    <div id="loginMessage" class="alert mb-4" style="display: none;"></div>

    <form id="loginForm">
      <div class="mb-4">
        <input type="email" class="form-control" id="loginEmail" placeholder="Correo electrónico" required>
      </div>
      <div class="mb-4">
        <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>

      <div class="auth-links">
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      </div>
    </form>
  </div>
</main>

<!-- Footer -->
<footer class="footer-custom">
  <div class="container text-center">
    <p class="mb-0">&copy; 2025 MiApp. Todos los derechos reservados.</p>
  </div>
</footer>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    sendEmailVerification
  } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAki1J6NbnvJXfzC98i0EhG0APn7m1bmNM",
    authDomain: "basegaby-37b65.firebaseapp.com",
    projectId: "basegaby-37b65",
    storageBucket: "basegaby-37b65.appspot.com",
    messagingSenderId: "704261450213",
    appId: "1:704261450213:web:8eb5bb135b00c7795c670c",
    measurementId: "G-M3YMGDX62Z"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function showMessage(message, type) {
    const messageDiv = document.getElementById("loginMessage");
    messageDiv.innerHTML = message;
    messageDiv.className = `alert alert-${type}`;
    messageDiv.style.display = "block";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      if (!user.emailVerified) {
        showMessage("Por favor, verifica tu correo electrónico antes de continuar.", "warning");
        return;
      }

      showMessage("¡Inicio de sesión exitoso! Redirigiendo...", "success");

      setTimeout(() => {
        window.location.href = "user.html";
      }, 2000);

    } catch (error) {
      let errorMessage = "Error al iniciar sesión: " + error.message;

      if (error.code === "auth/user-not-found") {
        errorMessage = "Usuario no registrado.";
      } else if (error.code === "auth/wrong-password") {
        errorMessage = "Contraseña incorrecta.";
      } else if (error.code === "auth/invalid-email") {
        errorMessage = "Formato de correo inválido.";
      }

      showMessage(errorMessage, "danger");
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
