<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - MiApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos personalizados */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    .navbar-custom {
      background-color: #343a40;
    }
    
    .footer-custom {
      background-color: #343a40;
      color: white;
      padding: 1rem 0;
      margin-top: auto;
    }
    
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 0;
      flex-grow: 1;
    }
    
    .auth-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      padding: 2.5rem;
      width: 100%;
      max-width: 500px;
    }
    
    .auth-card .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .auth-card h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #343a40;
    }
    
    /* Aumentar tamaño de los elementos del formulario */
    .form-control {
      padding: 12px 15px;
      font-size: 1.05rem;
      height: 48px;
      margin-bottom: 1.2rem;
      border-radius: 6px;
    }
    
    .btn {
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
    }
    
    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 1.05rem;
    }
    
    .alert {
      font-size: 1.05rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="./img/logo1.gif" alt="Logo" style="border-radius: 100%;"> MiApp
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="nosotros.html">Nosotros</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contacto.html">Contacto</a>
          </li>
        </ul>
        
        <ul class="navbar-nav ms-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="accesoDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fas fa-user-circle me-1"></i> Acceso
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accesoDropdown">
              <li><a class="dropdown-item" href="login.html"><i class="fas fa-sign-in-alt me-2"></i>Login</a></li>
              <li><a class="dropdown-item active" href="registro.html"><i class="fas fa-user-plus me-2"></i>Registro</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="ayuda.html"><i class="fas fa-question-circle me-2"></i>Ayuda</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="login-container">
    <div class="auth-card">
      <div class="logo">
        <h2>Crear Cuenta</h2>
      </div>
      
      <div id="registerMessage" class="alert mb-4" style="display: none;"></div>
      
      <form id="registerForm">
        <div class="mb-4">
          <input type="email" class="form-control" id="regEmail" placeholder="Correo electrónico" required>
        </div>
        <div class="mb-4">
          <input type="password" class="form-control" id="regPassword" placeholder="Contraseña (mínimo 6 caracteres)" required>
        </div>
        <div class="mb-4">
          <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirmar contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-4 py-3">Registrarse</button>
        
        <div class="auth-links">
          <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-custom">
    <div class="container text-center">
      <p class="mb-0">&copy; 2025 MiApp. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    // Tu configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAki1J6NbnvJXfzC98i0EhG0APn7m1bmNM",
      authDomain: "basegaby-37b65.firebaseapp.com",
      projectId: "basegaby-37b65",
      storageBucket: "basegaby-37b65.appspot.com",
      messagingSenderId: "704261450213",
      appId: "1:704261450213:web:8eb5bb135b00c7795c670c",
      measurementId: "G-M3YMGDX62Z"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Mostrar mensajes
    function showMessage(message, type) {
      const messageDiv = document.getElementById('registerMessage');
      messageDiv.innerHTML = message;
      messageDiv.className = `alert alert-${type}`;
      messageDiv.style.display = 'block';
    }

    // Registrar nuevo usuario
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      // Validaciones
      if (password !== confirmPassword) {
        showMessage('Las contraseñas no coinciden', 'danger');
        return;
      }

      if (password.length < 6) {
        showMessage('La contraseña debe tener al menos 6 caracteres', 'danger');
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        // Enviar email de verificación
        await sendEmailVerification(userCredential.user);
        
        showMessage('¡Registro exitoso! Se ha enviado un email de verificación. Redirigiendo...', 'success');
        
        // Redirigir después de 3 segundos
        setTimeout(() => {
          window.location.href = "user.html";
        }, 3000);
        
      } catch (error) {
        let errorMessage = "Error al registrar: " + error.message;
        
        if (error.code === "auth/email-already-in-use") {
          errorMessage = "Este email ya está registrado. ¿Quieres <a href='login.html'>iniciar sesión</a>?";
        } else if (error.code === "auth/invalid-email") {
          errorMessage = "El formato del email es incorrecto";
        } else if (error.code === "auth/weak-password") {
          errorMessage = "La contraseña es demasiado débil";
        }
        
        showMessage(errorMessage, 'danger');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
